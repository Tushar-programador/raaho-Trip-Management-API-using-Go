name: trip-management

# Startup order: postgres (healthy) -> migrate (exits 0) -> api (healthy).
# Migrations run exactly once per `up` in their own container; API replicas
# never migrate, and refuse to start if the schema is behind.
#
# Two database roles:
#   - the owner (POSTGRES_USER) runs migrations and API-key administration;
#   - trip_api is what the API connects as: row access only, no DDL.

x-admin-database-url: &admin-database-url postgres://${POSTGRES_USER:-trips}:${POSTGRES_PASSWORD:-trips}@postgres:5432/${POSTGRES_DB:-trips}?sslmode=disable
x-api-database-url: &api-database-url postgres://trip_api:${API_DB_PASSWORD:-trip_api}@postgres:5432/${POSTGRES_DB:-trips}?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trips}
      POSTGRES_DB: ${POSTGRES_DB:-trips}
      # Read by deploy/postgres/init/02-create-api-role.sh.
      API_DB_PASSWORD: ${API_DB_PASSWORD:-trip_api}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First start only: creates the trips_test database and the trip_api login role.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    image: trip-management-api:local
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      ADMIN_DATABASE_URL: *admin-database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: trip-management-api:local
    environment:
      DATABASE_URL: *api-database-url
      HTTP_ADDR: ":8080"
      # Fixed rather than read from .env, where LOG_FORMAT=text is meant for `make run`.
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Longer than SHUTDOWN_TIMEOUT (which includes the drain delay), so Docker does not
    # SIGKILL the API while it is still draining.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
