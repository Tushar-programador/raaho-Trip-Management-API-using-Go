name: trip-management

# Startup order: postgres (healthy) -> migrate (exits 0) -> api (healthy).
# Migrations run exactly once per `up` in their own container; API replicas
# never migrate, and refuse to start if the schema is behind.

x-database-url: &database-url postgres://${POSTGRES_USER:-trips}:${POSTGRES_PASSWORD:-trips}@postgres:5432/${POSTGRES_DB:-trips}?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trips}
      POSTGRES_DB: ${POSTGRES_DB:-trips}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the trips_test database used by the integration tests (first start only).
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    image: trip-management-api:local
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: trip-management-api:local
    environment:
      DATABASE_URL: *database-url
      HTTP_ADDR: ":8080"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
